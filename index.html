<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شخبطة - لعبة الرسم والتخمين</title>
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <!-- Landing Page -->
    <div id="landingPage" class="landing-page">
        <div class="landing-content">
            <h1>🎨 شخبطة 🎨</h1>
            <p>لعبة الرسم والتخمين</p>
            <div class="landing-buttons">
                <button id="hostGameBtn" class="landing-btn">استضافة لعبة</button>
                <button id="joinGameBtn" class="landing-btn">انضمام للعبة</button>
            </div>
        </div>
    </div>

    <!-- Game Area -->
    <div id="gameArea" class="game-area" style="display: none;">
        <!-- Left Panel - Players and Chat -->
        <div class="left-panel">
            <div class="players-section">
                <h3>اللاعبون</h3>
                <div class="players-list" id="playersList">
                    <!-- Players will be added here -->
                </div>
            </div>
            
            <div class="chat-section">
                <h3>المحادثة</h3>
                <div class="chat-messages" id="chatMessages">
                    <!-- Chat messages will appear here -->
                </div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." maxlength="100">
                    <button id="sendMessage">إرسال</button>
                </div>
            </div>
        </div>

        <!-- Center Panel - Game Area -->
        <div class="center-panel">
            <div class="game-info">
                <div class="current-player" id="currentPlayer">انتظار اللاعبين...</div>
                <div class="word-display" id="wordDisplay">كلمة السر</div>
                <div class="timer" id="timer">60</div>
            </div>
            
            <div class="canvas-container">
                <canvas id="gameCanvas" width="800" height="600"></canvas>
            </div>
        </div>

        <!-- Right Panel - Controls -->
        <div class="right-panel">
            <div class="game-settings" id="gameSettings">
                <h3>إعدادات اللعبة</h3>
                <div class="setting-item">
                    <label for="gameTime">مدة الجولة:</label>
                    <select id="gameTime">
                        <option value="30">30 ثانية</option>
                        <option value="60" selected>60 ثانية</option>
                        <option value="90">90 ثانية</option>
                        <option value="120">120 ثانية</option>
                    </select>
                </div>
            </div>
            
            <div class="ready-section" id="readySection">
                <h3>🎮 جاهز للعب؟</h3>
                <button id="readyBtn" class="ready-btn">أنا جاهز! ✅</button>
                <div class="ready-status" id="readyStatus">انتظار اللاعبين...</div>
            </div>
            
            <div class="game-controls">
                <button id="startGame" class="control-btn" disabled>بدء اللعبة</button>
            </div>
            
            <div class="avatar-section">
                <h3>👤 اختيار الصورة الشخصية</h3>
                <div class="avatar-preview">
                    <div class="avatar-preview-large" id="avatarPreview">😊</div>
                </div>
                <div class="emoji-grid" id="emojiGrid">
                    <!-- Emojis will be added by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Room Modal -->
    <div id="roomModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="modalTitle">استضافة لعبة</h2>
            <div class="modal-body">
                <div class="input-group">
                    <label for="playerName">اسمك:</label>
                    <input type="text" id="playerName" placeholder="أدخل اسمك" maxlength="20">
                </div>
                <div class="input-group" id="roomCodeInput">
                    <label for="roomCode">كود الغرفة:</label>
                    <input type="text" id="roomCode" placeholder="أدخل كود الغرفة" maxlength="6">
                </div>
            </div>
            <div class="modal-actions">
                <button id="createRoom" class="modal-btn primary" style="display: none;">إنشاء غرفة</button>
                <button id="joinRoom" class="modal-btn secondary" style="display: none;">انضمام</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
